<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Shopping Cart Icon -->
  <g filter="url(#glow)">
    <path d="M140 160 H180 L216 320 H356 L386 200 H196" fill="none" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Wheels -->
    <circle cx="236" cy="370" r="22" fill="#10b981" />
    <circle cx="336" cy="370" r="22" fill="#10b981" />
    <!-- Cloud & Sync symbol inside/above cart -->
    <path d="M260 250 C260 236 272 224 286 224 C292 216 304 210 316 214 C328 210 342 218 344 230 C352 232 358 240 358 248 C358 258 350 266 340 266 H270 C264 266 260 258 260 250 Z" fill="#38bdf8" opacity="0.9" />
  </g>
</svg>
